name: Publish core to npm

on:
  workflow_dispatch:

# Publishing uses npm Trusted Publishing (OIDC): no npm token is stored anywhere.
# The trusted publisher for @athene-x/whimui on npmjs.com must name this repository and
# this workflow file (publish.yml).
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node --test "packages/core/tests/*.test.mjs"
      - name: Publish core if this version is not on npm yet
        working-directory: packages/core
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; nothing to do."
            exit 0
          fi
          # npm (11.5.1+) exchanges the GitHub OIDC token for a short-lived publish token.
          npm publish
          tag="$name@$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
