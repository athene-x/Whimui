# Keycloak for the demo app only. `pnpm --filter demo keycloak` (reads apps/demo/.env).
# Differs from the team's deployment/compose.yaml on purpose: the dev-file database keeps the
# demo self-contained, and there is no mailpit or theme. Realm changes need a fresh volume:
# `docker compose down -v` (loses the realm's users; only this demo's).
name: whimui-demo

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080

      # Placeholders in keycloak/realms/whimui-demo-realm.json
      DEMO_WEB_URL: ${APP_URL:-http://localhost:3002}
      DEMO_WEB_INTERNAL_URL: ${APP_INTERNAL_URL:-http://host.docker.internal:3002}
      DEMO_WEB_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:?set AUTH_CLIENT_SECRET in apps/demo/.env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?set DEMO_USER_PASSWORD in apps/demo/.env}
    ports:
      - '${KEYCLOAK_PORT:-8082}:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
      # Whole data dir: a volume created only for data/h2 would be root-owned and unwritable for Keycloak.
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      # No curl in the image: a bash TCP probe. The Host header matters: Keycloak 26 errors without one.
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/whimui-demo HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  keycloak-data:
